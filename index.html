able||'')).toLowerCase().includes(q.value.toLowerCase())));s0.textContent=a.length;s1.textContent=a.filter(x=>x.estado==='Ingresado para SC1').length;s2.textContent=a.filter(x=>x.estado==='Ingresado para planeacion').length;s3.textContent=a.filter(x=>['Llegaron convenios','Convenios entregados'].includes(x.estado)).length;s4.textContent=a.filter(x=>x.estado==='Finalizado').length;xt.innerHTML='<option value="">Selecciona trámite</option>'+a.map(x=>`<option value="${x.id}">${esc(x.cliente_nombre)} · ${esc(x.folio)}</option>`).join('');T.innerHTML=v.length?`<table><tr><th>Cliente</th><th>Folio</th><th>Fecha de ingreso</th><th>Días desde ingreso</th><th>Responsable</th><th>Estado</th><th>Prioridad</th><th>Acciones</th></tr>${v.map(x=>`<tr><td><b>${esc(x.cliente_nombre)}</b></td><td>${esc(x.folio)}</td><td>${esc(x.fecha_entrega)}</td><td>${ingresoBadge(x.fecha_entrega)}</td><td>${esc(x.responsable||'—')}</td><td><span class=badge>${esc(sl(x.estado))}</span></td><td>${esc(x.prioridad)}</td><td><div class=acts><button class=g onclick="detail('${x.id}')">Expediente</button><button class=g onclick="edit('${x.id}')">Editar</button><button type=button class="g danger" onclick="deleteTramite('${x.id}',this)">Eliminar trámite</button></div></td></tr>`).join('')}</table>`:'<p class=mut style="padding:20px">No hay trámites.</p>'}q.oninput=render;f.onchange=render;nw.onclick=()=>{cm();M.classList.add('on')};function cm(){M.classList.remove('on');form.reset();id.value='';mt.textContent='Nuevo trámite';fm.textContent=''}window.edit=i=>{let x=a.find(y=>y.id===i);id.value=x.id;cli.value=x.cliente_nombre;fol.value=x.folio;fe.value=x.fecha_entrega;res.value=x.responsable||'';est.value=x.estado;pri.value=x.prioridad||'normal';obs.value=x.observaciones||'';mt.textContent='Editar trámite';M.classList.add('on')};form.onsubmit=async z=>{z.preventDefault();let v={cliente_nombre:cli.value.trim(),folio:fol.value.trim(),fecha_entrega:fe.value,responsable:res.value.trim()||null,estado:est.value,prioridad:pri.value,observaciones:obs.value.trim()||null,fecha_finalizacion:est.value==='Finalizado'?new Date().toISOString().slice(0,10):null,updated_at:new Date().toISOString()},r=id.value?await sb.from('tramites').update(v).eq('id',id.value):await sb.from('tramites').insert({...v,created_by:u.id});if(r.error){fm.textContent=r.error.message;fm.className='msg err'}else{fm.textContent='Guardado correctamente';fm.className='msg ok';await load();setTimeout(cm,350)}};window.detail=async i=>{did=i;let t=a.find(x=>x.id===i),{data:v,error}=await sb.from('tramite_archivos').select('*').eq('tramite_id',i).order('created_at',{ascending:false});if(error)return alert(error.message);dt.textContent='Expediente · '+t.folio;db.innerHTML=`<p><b>${esc(t.cliente_nombre)}</b><br><span class=badge>${esc(sl(t.estado))}</span></p><p><b>Fecha de ingreso:</b> ${esc(t.fecha_entrega)}<br><b>Días desde ingreso:</b> ${ingresoBadge(t.fecha_entrega)}</p><p><b>Observaciones:</b> ${esc(t.observaciones||'Sin observaciones')}</p><h4>Archivos</h4><div class=files>${v.length?v.map(x=>`<div class=file><b>${esc(x.nombre)}</b><button class=g onclick="openf('${x.id}')">Abrir</button></div>`).join(''):'<span class=mut>Sin archivos.</span>'}</div>${pr.role==='maestro'?`<p><input id=up type=file multiple accept="application/pdf,image/jpeg,image/png,image/webp"></p><button class=p onclick="upload()">Subir fotos / PDF</button><div id=um class=msg></div>`:''}`;D.classList.add('on')};window.upload=async()=>{let fs=[...(up.files||[])];if(!fs.length)return um.textContent='Selecciona un archivo.';um.textContent='Subiendo…';for(let f of fs){if(f.size>10485760)return um.textContent='Un archivo supera 10 MB';let path=`${u.id}/${did}/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`,r=await sb.storage.from('tramite-archivos').upload(path,f,{contentType:f.type});if(r.error)return um.textContent=r.error.message;let m=await sb.from('tramite_archivos').insert({tramite_id:did,uploaded_by:u.id,nombre:f.name,storage_path:path,mime_type:f.type});if(m.error)return um.textContent=m.error.message}await detail(did)};window.openf=async i=>{let{data:f,error}=await sb.from('tramite_archivos').select('*').eq('id',i).single();if(error)return alert(error.message);let{data:s,error:e}=await sb.storage.from('tramite-archivos').createSignedUrl(f.storage_path,120);e?alert(e.message):window.open(s.signedUrl,'_blank')};access.onclick=()=>X.classList.add('on');xf.onsubmit=async z=>{z.preventDefault();let{error}=await sb.rpc('assign_client_to_tramite',{p_tramite_id:xt.value,p_email:xe.value.trim().toLowerCase()});xm.textContent=error?error.message:'Acceso concedido correctamente.';xm.className=error?'msg err':'msg ok'};async function loadc(){let{data,error}=await sb.from('tramites').select('*').order('fecha_entrega',{ascending:false});if(error)return alert(error.message);a=data||[];client.innerHTML=a.length?a.map(x=>`<div class="panel client"><small class=mut>FOLIO ${esc(x.folio)}</small><h3>${esc(x.cliente_nombre)}</h3><p><b>Fecha de ingreso:</b> ${esc(x.fecha_entrega)}<br><b>Días desde ingreso:</b> ${ingresoBadge(x.fecha_entrega)}</p><p><span class=badge>${esc(sl(x.estado))}</span></p><p>${esc(x.observaciones||'Sin actualización')}</p><button class=g onclick="detail('${x.id}')">Ver expediente y documentos</button></div>`).join(''):'<div class="panel client">Todavía no tienes trámites vinculados.</div>'}(async()=>{let{data}=await sb.auth.getSession();data.session?enter(data.session.user):0})();
const deletingTramites = new Set();
window.deleteTramite = async (i, button) => {
  if (pr?.role !== 'maestro' || deletingTramites.has(i)) return;
  const tramite = a.find(x => x.id === i);
  if (!tramite) return;
  if (!confirm('¿Eliminar el trámite de ' + tramite.cliente_nombre + ' (folio ' + tramite.folio + ')?\n\nSe eliminarán su historial y los documentos del expediente. Esta acción no se puede deshacer.')) return;
  deletingTramites.add(i);
  if (button) { button.disabled = true; button.textContent = 'Eliminando…'; }
  let deleted = false;
  try {
    const files = await sb.from('tramite_archivos').select('storage_path').eq('tramite_id', i);
    if (files.error) throw files.error;
    const result = await sb.from('tramites').delete().eq('id', i).select('id');
    if (result.error) throw result.error;
    if (!result.data?.some(row => row.id === i)) throw new Error('No se eliminó el trámite. Comprueba tus permisos y actualiza la página.');
    deleted = true;
    a = a.filter(x => x.id !== i);
    if (did === i) { D.classList.remove('on'); did = null; }
    if ($('id').value === i) cm();
    render();
    const paths = [...new Set((files.data || []).map(f => f.storage_path).filter(Boolean))];
    for (let offset = 0; offset < paths.length; offset += 100) {
      const cleanup = await sb.storage.from('tramite-archivos').remove(paths.slice(offset, offset + 100));
      if (cleanup.error) throw cleanup.error;
    }
    alert('Trámite eliminado correctamente.');
  } catch (error) {
    alert(deleted
      ? 'El trámite fue eliminado, pero no se pudo completar la limpieza de sus archivos. Contacta al administrador. Detalle: ' + (error.message || String(error))
      : 'No se pudo eliminar el trámite: ' + (error.message || String(error)));
  } finally {
    deletingTramites.delete(i);
    if (button) { button.disabled = false; button.textContent = 'Eliminar trámite'; }
  }
};

function ingresoToday(now = new Date()) {
  const parts = new Intl.DateTimeFormat('en-US', {timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);
  const part = type => parts.find(p => p.type === type).value;
  return part('year') + '-' + part('month') + '-' + part('day');
}
function ingresoDayNumber(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return NaN;
  const [year,month,day] = value.split('-').map(Number);
  const date = new Date(0);
  date.setUTCHours(0,0,0,0);
  date.setUTCFullYear(year,month-1,day);
  if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month-1 || date.getUTCDate() !== day) return NaN;
  return Math.floor(date.getTime()/86400000);
}
function ingresoAge(value, today = ingresoToday()) {
  const start = ingresoDayNumber(value), end = ingresoDayNumber(today);
  if (!Number.isFinite(start) || !Number.isFinite(end)) return {tone:'neutral',label:'Sin fecha válida'};
  if (start > end) return {tone:'neutral',label:'Fecha futura'};
  const days = end-start+1;
  return {days,tone:days<=24?'green':days<=48?'yellow':'red',label:days + (days===1?' día':' días')};
}
function ingresoAgeContent(value) {
  const info = ingresoAge(value);
  const colors = {green:'Verde: de 1 a 24 días',yellow:'Amarillo: de 25 a 48 días',red:'Rojo: 49 días o más',neutral:info.label};
  return '<span>' + info.label + '</span> <span class="age-dot '+info.tone+'" role="img" aria-label="'+colors[info.tone]+'" title="'+colors[info.tone]+'"></span>';
}
function ingresoBadge(value) {
  return '<span class="ingreso-age" data-ingreso="'+esc(value||'')+'">'+ingresoAgeContent(value)+'</span>';
}
setInterval(() => {
  document.querySelectorAll('[data-ingreso]').forEach(node => {node.innerHTML = ingresoAgeContent(node.dataset.ingreso);});
},60000);
